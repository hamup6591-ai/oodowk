<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>استعلام عن فاتورة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#20232b;
    --ink-soft:#6b7280;
    --line:#e6e8ed;
    --red:#e4312a;
    --red-soft:#fdeceb;
    --green:#1e9e5a;
    --green-soft:#d4f0e0;
    --radius:16px;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100%;max-width:430px;min-height:100%;
    background:var(--bg);display:flex;flex-direction:column;
  }

  .appbar{
    background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:100;
  }
  .appbar h1{font-size:22px;font-weight:800}
  .icon-btn{background:none;border:none;color:var(--ink);cursor:pointer;display:flex}

  .content{flex:1;padding:28px 16px 40px}

  .bot-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 22px;box-shadow:0 6px 18px rgba(28,33,48,.04);text-align:center;
  }

  .bot-icon{
    width:80px;height:80px;border-radius:50%;
    background:linear-gradient(135deg,var(--red),#c0271f);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;box-shadow:0 8px 24px rgba(228,49,42,.25);
  }

  .bot-title{font-size:24px;font-weight:800;margin-bottom:6px}
  .bot-sub{color:var(--ink-soft);font-size:16px;margin-bottom:28px}

  .input-wrap{
    display:flex;gap:10px;margin-bottom:16px;
  }
  .input-wrap input{
    flex:1;height:56px;border:1.6px solid #dfe2e8;border-radius:14px;
    padding:0 16px;font-family:inherit;font-size:18px;font-weight:700;
    text-align:center;outline:none;direction:ltr;
    transition:border-color .2s;
  }
  .input-wrap input:focus{border-color:var(--red)}
  .input-wrap input::placeholder{color:#c0c4cc;font-weight:500}

  .search-btn{
    height:56px;padding:0 24px;border:none;border-radius:14px;
    background:var(--red);color:#fff;font-family:inherit;
    font-weight:800;font-size:17px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    transition:.15s;white-space:nowrap;
  }
  .search-btn:active{transform:scale(.98)}
  .search-btn:disabled{background:var(--line);color:#999;cursor:not-allowed}

  .err-msg{
    color:var(--red);font-size:14px;font-weight:700;
    min-height:20px;margin-bottom:4px;
  }

  .result{display:none;margin-top:24px;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .result-card{
    background:#fff;border:2px solid var(--green);border-radius:16px;
    padding:24px 20px;position:relative;overflow:hidden;
  }
  .result-card.error{border-color:var(--red)}

  .result-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .result-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--green-soft);color:var(--green);
    border-radius:8px;padding:6px 14px;font-weight:800;font-size:14px;
  }
  .result-card.error .result-badge{background:var(--red-soft);color:var(--red)}

  .result-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid #f0f2f5;
  }
  .result-row:last-child{border-bottom:none}
  .result-label{color:var(--ink-soft);font-size:15px;font-weight:600}
  .result-value{font-size:17px;font-weight:800}
  .result-amount{font-size:28px;font-weight:800;color:var(--red)}

  .pay-link{
    display:block;width:100%;margin-top:20px;height:56px;border:none;
    border-radius:999px;background:var(--red);color:#fff;
    font-family:inherit;font-weight:800;font-size:18px;
    cursor:pointer;transition:.15s;
    box-shadow:0 8px 20px rgba(228,49,42,.25);
  }
  .pay-link:active{transform:scale(.98)}

  .chat-history{margin-top:20px}
  .chat-msg{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;
    animation:fadeUp .3s ease;
  }
  .chat-msg.user-msg{
    background:var(--red-soft);border-color:transparent;
    margin-right:40px;
  }
  .chat-msg.bot-msg{
    margin-left:40px;
  }
  .chat-msg .msg-text{font-size:16px;font-weight:600}
  .chat-msg .msg-amount{font-size:22px;font-weight:800;color:var(--red);margin-top:6px}
  .chat-msg .msg-desc{color:var(--ink-soft);font-size:14px;margin-top:4px}
  .chat-msg .msg-error{color:var(--red);font-weight:700}
  .chat-msg .msg-time{color:var(--ink-soft);font-size:12px;margin-top:6px}

  .loading{display:none;text-align:center;padding:20px}
  .spinner{
    width:36px;height:36px;border:3px solid var(--line);
    border-top-color:var(--red);border-radius:50%;
    animation:spin .7s linear infinite;margin:0 auto 8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="app">

    <header class="appbar">
      <button class="icon-btn" aria-label="رجوع" onclick="history.back()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15M13 6l6 6-6 6"/>
        </svg>
      </button>
      <h1>استعلام عن فاتورة</h1>
      <div style="width:26px"></div>
    </header>

    <main class="content">
      <div class="bot-card">
        <div class="bot-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h2 class="bot-title">بوت الفواتير</h2>
        <p class="bot-sub">أدخل رقم الفاتورة لمعرفة المبلغ المطلوب</p>

        <div class="input-wrap">
          <input type="text" id="invoiceInput" placeholder="رقم الفاتورة" inputmode="text" autocomplete="off">
          <button class="search-btn" id="searchBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            بحث
          </button>
        </div>
        <p class="err-msg" id="errMsg"></p>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span style="color:var(--ink-soft);font-weight:700">جاري البحث...</span>
      </div>

      <div class="chat-history" id="chatHistory"></div>
    </main>

  </div>

<script>
  const input = document.getElementById('invoiceInput');
  const btn = document.getElementById('searchBtn');
  const errMsg = document.getElementById('errMsg');
  const loading = document.getElementById('loading');
  const chatHistory = document.getElementById('chatHistory');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchInvoice();
  });
  btn.addEventListener('click', searchInvoice);

  async function searchInvoice() {
    const num = input.value.trim();
    if (!num) {
      errMsg.textContent = 'يرجى إدخال رقم الفاتورة';
      return;
    }
    errMsg.textContent = '';
    btn.disabled = true;
    loading.style.display = 'block';

    addMessage('user', num);
    input.value = '';

    try {
      const res = await fetch('/api/invoice/' + encodeURIComponent(num));
      const data = await res.json();

      if (!res.ok || !data.ok) {
        addMessage('bot-error', 'لا توجد فاتورة بهذا الرقم: ' + num);
      } else {
        const inv = data.invoice;
        addMessage('bot-success', {
          number: inv.invoice_number,
          amount: inv.amount,
          description: inv.description
        });
      }
    } catch (e) {
      addMessage('bot-error', 'حدث خطأ في الاتصال. حاول مرة أخرى.');
    }

    btn.disabled = false;
    loading.style.display = 'none';
    input.focus();
  }

  function addMessage(type, content) {
    const div = document.createElement('div');
    div.className = 'chat-msg';
    const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

    if (type === 'user') {
      div.classList.add('user-msg');
      div.innerHTML = '<div class="msg-text">بحث عن فاتورة رقم: <strong style="direction:ltr;display:inline-block">' + esc(content) + '</strong></div>'
        + '<div class="msg-time">' + time + '</div>';
    } else if (type === 'bot-error') {
      div.classList.add('bot-msg');
      div.innerHTML = '<div class="msg-error">' + esc(content) + '</div>'
        + '<div class="msg-time">' + time + '</div>';
    } else if (type === 'bot-success') {
      div.classList.add('bot-msg');
      div.innerHTML = '<div class="msg-text">تم العثور على الفاتورة</div>'
        + '<div class="msg-amount">د.ك ' + esc(content.amount) + '</div>'
        + (content.description ? '<div class="msg-desc">' + esc(content.description) + '</div>' : '')
        + '<div class="msg-time">' + time + '</div>';
    }

    chatHistory.prepend(div);
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>
</body>
</html>
